<div
    class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden auth-wrapper">
    <div class="flex flex-column align-items-center justify-content-center">
        <div class="border-auth">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <img src="assets/layout/images/logo_vrsystem2.png" alt="Image" height="100" class="mb-3">
                    <!-- <div class="text-900 text-3xl font-medium mb-3">Welcome, Isabel!</div> -->
                    <!-- <span class="text-600 font-medium">Sign in to continue</span> -->
                </div>

                <div>
                    <form #form="ngForm" (ngSubmit)="onSubmit(form)" (keydown.enter)="onSubmit(form)">
                        <label for="email" class="block text-900 text-xl font-medium mb-2">Email</label>
                        <input id="email" name="email" type="text" placeholder="Email address" pInputText
                            class="w-full md:w-30rem mb-5" style="padding:1rem" ngModel required>

                        <label for="password" class="block text-900 font-medium text-xl mb-2">Password</label>
                        <p-password id="password" name="password" [(ngModel)]="password" placeholder="Password"
                            [toggleMask]="true" styleClass="mb-5" inputStyleClass="w-full p-3 md:w-30rem" ngModel
                            required></p-password>

                        <div class="flex align-items-center justify-content-between mb-5 gap-5">
                            <div class="flex align-items-center">
                                <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
                                <label for="rememberme1">Remember me</label>
                            </div>
                            <a class="font-medium no-underline ml-2 text-right cursor-pointer"
                                style="color: var(--primary-color)">Forgot password?</a>
                        </div>
                        <button type="submit" pButton pRipple class="w-full p-3 text-xl flex align-items-center justify-content-center">
                            <i class="pi pi-spin pi-spinner" style="font-size: 2rem" *ngIf="loading"></i>
                            <span *ngIf="!loading">Sign In</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
