<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden auth-wrapper">
    <div class="flex flex-column align-items-center justify-content-center w-full px-3 sm:px-0">
        <div class="border-auth w-full max-w-md">
            <div class="w-full max-w-md mx-auto surface-card py-6 px-4 sm:px-8" style="border-radius: 24px">
                <div class="text-center mb-5">
                    <img src="assets/layout/images/logo_vrsystem2.png" alt="Logo" height="80" class="mb-3">
                </div>

                <div>
                    <form #form="ngForm" (ngSubmit)="onSubmit(form)" (keydown.enter)="onSubmit(form)" novalidate>
                        <label for="username" class="block text-900 text-lg font-medium mb-2">Usuário</label>
                        <input id="username" name="username" type="text" placeholder="Digite seu usuário" pInputText
                            class="w-full p-3 mb-4" ngModel required>

                        <label for="password" class="block text-900 font-medium text-lg mb-2">Senha</label>
                        <p-password id="password" name="password" [(ngModel)]="password" placeholder="Digite sua senha"
                            [toggleMask]="true" inputStyleClass="w-full p-3" styleClass="mb-4 w-full" ngModel required></p-password>

                        <div class="flex align-items-center justify-content-between mb-4">
                            <div class="flex align-items-center">
                                <p-checkbox id="rememberme" name="rememberme" [binary]="true" styleClass="mr-2" [(ngModel)]="rememberme"></p-checkbox>
                                <label for="rememberme">Lembrar-me</label>
                            </div>
                            <a class="font-medium no-underline text-right cursor-pointer"
                                style="color: var(--primary-color)">Esqueceu a senha?</a>
                        </div>

                        <button id="enter" type="submit" pButton pRipple class="w-full p-3 text-lg flex align-items-center justify-content-center">
                            <i class="pi pi-spin pi-spinner" style="font-size: 1.8rem" *ngIf="loading"></i>
                            <span *ngIf="!loading">Entrar</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
